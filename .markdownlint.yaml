# markdownlint rules: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
default: true

# Prose and tables wrap naturally; line length is not enforced.
MD013: false

# Reference docs repeat subsection headings (e.g. "URI", "Notes") under
# different parents by design; only flag duplicates among siblings.
MD024:
  siblings_only: true

# Many illustrative code blocks intentionally omit a language hint.
MD040: false

# Enforce aligned table columns (pipes line up with the header row).
MD060:
  style: aligned
